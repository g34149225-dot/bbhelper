                          "3. Открой Block Blast, нажми ⚙ справа вверху и совмести зелёную сетку с полем и фигурами.\n" +
                          "4. Закрой ⚙ — подсказки появятся сами: цветные рамки 1, 2, 3 = порядок и места фигур.\n5. Кнопка «Авто» рядом с ⚙ включает самостоятельную расстановку."
                  })
                  l.addView(Button(this).apply { text = "Запустить"; setOnClickListener { start() } })
                  l.addView(Button(this).apply {
                      text = "Служба доступности (для авто-хода)"
